name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: petmemoreal_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: petmemoreal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U petmemoreal_ci -d petmemoreal_ci"
          --health-interval=5s --health-timeout=5s --health-retries=10
      mailpit:
        image: axllent/mailpit:v1.31.2
        ports:
          - 1025:1025
          - 8025:8025
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: petmemoreal_ci
      POSTGRES_PASSWORD: local_ci_only
      POSTGRES_DB: petmemoreal_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies from lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Deployment configuration tests
        run: corepack pnpm test:unit

      - name: Build
        run: corepack pnpm build

      - name: Install browser for tests
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: corepack pnpm test:e2e

      - name: Service outage fallback tests
        run: corepack pnpm exec playwright test --config=playwright.outage.config.ts

      - name: Vercel runtime tests
        run: corepack pnpm test:vercel

      - name: Vercel output build
        run: corepack pnpm build:vercel
