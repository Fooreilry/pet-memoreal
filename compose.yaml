name: petmemoreal

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.47
    command: ['mini', '-dir=/data']
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
      - '127.0.0.1:${S3_ADMIN_PORT:-23646}:23646'
    volumes:
      - storage_data:/data

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
    ports:
      - '127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    volumes:
      - mailpit_data:/data

volumes:
  postgres_data:
  storage_data:
  mailpit_data:
